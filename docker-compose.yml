version: '3.8'

services:
  postgres-inventory:
    image: postgres:14
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    networks:
      - arka-net

  postgres-order:
    image: postgres:14
    container_name: postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    networks:
      - arka-net

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - arka-net

  eureka:
    build: ./eureka-server
    container_name: eureka
    ports:
      - "8761:8761"
    depends_on:
      - postgres-inventory
      - postgres-order
    networks:
      - arka-net

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - arka-net

  inventory:
    build: ./inventory-service
    container_name: inventory
    ports:
      - "8081:8081"
    depends_on:
      - postgres-inventory
      - eureka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-inventory:5432/inventorydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - arka-net

  order:
    build: ./order-service
    container_name: order
    ports:
      - "8082:8082"
    depends_on:
      - postgres-order
      - inventory
      - eureka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - arka-net

networks:
  arka-net:
    driver: bridge
